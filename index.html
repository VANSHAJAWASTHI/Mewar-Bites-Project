<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/images/Mewar Treats Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="pVuQ3gBTWMO_NCY-OOAhra1nIiV6LaRoz1DRovfAmr8" />
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Performance Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://wa.me">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#d4a574">
  <meta name="msapplication-TileColor" content="#d4a574">
  <meta name="msapplication-config" content="/browserconfig.xml">
  
</head>
<body>
  <div id="root"></div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
  
  <!-- Performance Monitoring -->
  <script>
    // Core Web Vitals monitoring
    function reportWebVitals() {
      if (window.gtag) {
        // Report CLS, FID, LCP, etc.
        window.gtag('event', 'web_vitals', {
          event_category: 'performance'
        });
      }
    }
    
    // Lazy loading for images
    if ('IntersectionObserver' in window) {
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src || img.src;
            img.classList.remove('lazy');
            observer.unobserve(img);
          }
        });
      });
      
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('img[loading="lazy"]').forEach(img => {
          imageObserver.observe(img);
        });
      });
    }
  </script>
  
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
